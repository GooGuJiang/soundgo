name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: oven-sh/setup-bun@v2
      - name: Test Go HLS helper
        working-directory: helper
        run: go test -v ./...
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, build, and test plugin
        run: bun run check
      - name: Check for tracked-file changes
        run: git diff --exit-code
