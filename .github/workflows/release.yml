name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: oven-sh/setup-bun@v2
      - name: Test Go HLS helper
        working-directory: helper
        run: go test -v ./...
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, build, and test plugin
        run: bun run check

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build TypeScript plugin bundle
        run: bun run build
      - name: Build hls-helper (${{ matrix.goos }}-${{ matrix.goarch }})
        working-directory: helper
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist/stage/bin
          go build -trimpath -ldflags="-s -w" -o "../dist/stage/bin/hls-helper${{ matrix.ext }}" .
      - name: Package plugin ZIP
        run: |
          cp -r dist/plugin/* dist/stage/
          if [ -z "${{ matrix.ext }}" ]; then
            chmod +x dist/stage/bin/hls-helper
          fi
          (cd dist/stage && zip -r "../soundgo-${{ matrix.goos }}-${{ matrix.goarch }}.zip" .)
          (cd dist && sha256sum "soundgo-${{ matrix.goos }}-${{ matrix.goarch }}.zip" > "soundgo-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: soundgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/soundgo-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            dist/soundgo-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum --check ./*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256
